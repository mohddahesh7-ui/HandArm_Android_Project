name: Build HandArm APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Find the Android project (works even if uploaded one folder too deep)
        id: find
        run: |
          f=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$f" ]; then echo "settings.gradle.kts not found. Files in repo:"; find . -maxdepth 3 -not -path "./.git/*"; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Project found in: $(dirname "$f")"
      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HandArm-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
